<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../assets/Favicon.svg">
    <title>R.A - Activities</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container">
        <div id="header"></div>
        <div class="main-content-wrapper">
            <main role="main">
                <div class="content">
                    <h1>Activities</h1>
                    
                    <!-- GitHub Stats Section -->
                    <section class="github-stats">
                        <h2>GitHub Activity</h2>
                        
                        <!-- Contribution Graph -->
                        <div class="stats-card">
                            <img src="https://github-readme-streak-stats.herokuapp.com/?user=RamiHaider&theme=nightowl" 
                                 alt="GitHub Streak Stats" class="github-stat-img">
                        </div>

                        <!-- Language Stats -->
                        <div class="stats-card">
                            <img src="https://github-readme-stats.vercel.app/api/top-langs/?username=RamiHaider&langs_count=8&count_private=true&layout=compact&theme=react&hide_border=true&bg_color=0D1117" 
                                 alt="Top Programming Languages" class="github-stat-img">
                        </div>

                        <!-- Developer Stack -->
                        <div class="dev-stack">
                            <h3>Developer Stack</h3>
                            <div class="stack-badges">
                                <img src="https://img.shields.io/badge/-HTML5-333333?style=flat&logo=HTML5" alt="HTML5">
                                <img src="https://img.shields.io/badge/-CSS3-333333?style=flat&logo=CSS3&logoColor=1572B6" alt="CSS3">
                                <img src="https://img.shields.io/badge/-JavaScript-333333?style=flat&logo=javascript" alt="JavaScript">
                                <img src="https://img.shields.io/badge/-AWS-333333?style=flat&logo=amazon-aws" alt="AWS">
                                <img src="https://img.shields.io/badge/-Python-333333?style=flat&logo=python" alt="Python">
                            </div>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>
    <script src="../js/main.js"></script>
    <script src="../js/star-effect.js"></script>
</body>
</html>
