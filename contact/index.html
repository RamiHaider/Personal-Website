<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R.A - Contact</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container">
        <div id="header"></div>
        <div class="main-content-wrapper">
            <main role="main">
                <div class="content">
                    <h1>Contact Me</h1>
                    
                    <div class="contact-container">
                        <form action="https://formspree.io/f/xpwqqved" method="POST" class="contact-form">
                            <div class="form-group">
                                <label for="name">Name:</label>
                                <input type="text" id="name" name="name" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="email">Email:</label>
                                <input type="email" id="email" name="email" required>
                                <p class="form-description">This will help me respond to your query via email.</p>
                            </div>
                            
                            <div class="form-group">
                                <label for="message">Message:</label>
                                <textarea id="message" name="message" rows="6" required></textarea>
                                <p class="form-description">What would you like to discuss?</p>
                            </div>
                            
                            <button type="submit" class="submit-btn">Send Message</button>
                        </form>

                        <div class="email-text">
                            <p>Or email me at:</p>
                            <p>ramiaboushamalah [at] gmail [dot] com</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="../js/main.js"></script>
</body>
</html>
