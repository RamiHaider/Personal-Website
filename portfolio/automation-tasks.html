<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Series Anomaly Detection | Rami Haider</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    
    <!-- PostHog Analytics -->
    <script src="../js/analytics.js"></script>
    <style>
        .slide-section {
            margin: 40px 0;
            padding: 30px;
            background: transparent;
            border-radius: 12px;
            box-shadow: none;
        }
        
        .slide-image {
            width: 100%;
            max-width: 800px;
            border-radius: 8px;
            margin: 20px auto;
            display: block;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .key-point {
            background: transparent;
            padding: 20px;
            border-left: 4px solid #A4A155;
            margin: 20px 0;
            border-radius: 0 8px 8px 0;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .metric-card {
            background: transparent;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .metric-value {
            font-size: 28px;
            font-weight: 600;
            color: white;
            margin-bottom: 8px;
        }

        .metric-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        .bullet-list {
            list-style-type: none;
            padding-left: 0;
        }

        .bullet-list li {
            position: relative;
            padding-left: 25px;
            margin-bottom: 12px;
        }

        .bullet-list li:before {
            content: "•";
            position: absolute;
            left: 0;
            color: #495057;
            font-weight: bold;
        }

        .section-subtitle {
            color: #6c757d;
            font-size: 18px;
            margin-top: 30px;
            font-weight: 500;
        }

        /* Model testing interface styles */
        .model-test-section {
            margin: 40px 0;
            padding: 30px;
            background: transparent;
            border-radius: 12px;
            box-shadow: none;
        }

        .model-test-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .drawing-section, .upload-section {
            background: transparent;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .drawing-section h3, .upload-section h3 {
            color: #adb5bd;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .file-input {
            display: none;
        }

        .control-button {
            padding: 10px 20px;
            background-color: #495057;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.3s ease;
            margin-right: 10px;
        }

        .control-button:hover {
            background-color: #343a40;
        }

        .control-button.primary {
            background-color: #007bff;
        }

        .control-button.primary:hover {
            background-color: #0056b3;
        }

        .canvas-container {
            position: relative;
            max-width: 100%;
            margin: 0 auto;
            background-color: transparent;
            border-radius: 8px;
            box-shadow: none;
            overflow: hidden;
        }

        #drawing-canvas {
            border: 1px solid #adb5bd;
            background-color: white;
            border-radius: 8px;
            cursor: crosshair;
            display: block;
            margin: 0 auto;
        }

        .drawing-controls {
            display: flex;
            justify-content: center;
            margin-top: 15px;
            gap: 10px;
        }



        .results-container {
            margin-top: 30px;
            text-align: center;
        }

        .drawing-result-info {
            margin-top: 15px;
            padding: 10px;
            text-align: center;
            font-weight: 500;
            color: #adb5bd;
            border-radius: 5px;
        }

        #result-canvas {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            visibility: hidden;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(73, 80, 87, 0.2);
            border-top: 5px solid #495057;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-info {
            margin-top: 20px;
            padding: 15px;
            background-color: transparent;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
        }

        .visible {
            visibility: visible;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="header"></div>
        <div class="main-content-wrapper">
            <main role="main">
                <div class="content">
                    <h1>Detecting Anomalies in Time Series Data</h1>
                    

                    <div class="date-info" data-upload-date="2023-07-15" data-file-path="portfolio/automation-tasks.html">
                        <p>Original Upload: 2025-02-15</p>
                        <p>Last Updated: <span class="update-date"></span></p>
                    </div>

                    <!-- Model Testing Interface -->
                    <div class="model-test-section">
                        <h2>Test the Model</h2>
                        <p>Draw a time series or upload an image to see if our model can detect anomalies.</p>
                        <p>View all inferences uploaded and results <a href="https://api.ramihaider.me/dashboard" target="_blank">here</a> in the API's dashboard</p>
                        
                        <div class="model-test-container">
                            <!-- Drawing Canvas -->
                            <div class="drawing-section">
                                <h3>Draw Your Time Series</h3>
                                <div class="canvas-container" id="drawing-canvas-container">
                                    <canvas id="drawing-canvas" width="800" height="400"></canvas>
                                </div>
                                <div class="drawing-controls">
                                    <button class="control-button" id="clear-button">Clear</button>
                                    <button class="control-button" id="upload-button">📁 Upload</button>
                                    <button class="control-button primary" id="send-button">Send</button>
                                    <input type="file" id="file-input" class="file-input" accept="image/*">
                                </div>
                                <div class="drawing-result-info hidden" id="drawing-result-info">
                                    <!-- Results will be displayed here -->
                                </div>
                            </div>
                            
                            <!-- Results Display -->
                            <div class="results-container hidden" id="results-container">
                                <canvas id="result-canvas"></canvas>
                                <div class="loading-overlay" id="loading-overlay">
                                    <div class="spinner"></div>
                                    <p>Analyzing image...</p>
                                </div>
                                <div class="result-info hidden" id="result-info">
                                    <!-- Results will be displayed here -->
                                </div>
                            </div>
                        </div>
                    </div>
                    
 

                    <!-- Back to Top Button -->
                    <div style="position: fixed; bottom: 20px; right: 20px; z-index: 1000;">
                        <a href="#" class="scroll-to-top" style="display: none; align-items: center; justify-content: center; width: 40px; height: 40px; background-color: #495057; color: white; text-decoration: none; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: background-color 0.3s ease;">
                            ↑
                        </a>
                    </div>

                </div>
            </main>
        </div>
    </div>
    <script src="../js/main.js"></script>
    <script src="../js/scroll-to-top.js"></script>
    <script src="../js/dates.js"></script>
    
    <!-- Model Testing Interface JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Drawing canvas elements
            const drawingCanvas = document.getElementById('drawing-canvas');
            const drawingCtx = drawingCanvas.getContext('2d');
            const clearButton = document.getElementById('clear-button');
            const uploadButton = document.getElementById('upload-button');
            const sendButton = document.getElementById('send-button');
            const fileInput = document.getElementById('file-input');
            
            // Result elements
            const resultsContainer = document.getElementById('results-container');
            const resultCanvas = document.getElementById('result-canvas');
            const resultCtx = resultCanvas.getContext('2d');
            const loadingOverlay = document.getElementById('loading-overlay');
            const resultInfo = document.getElementById('result-info');
            const drawingResultInfo = document.getElementById('drawing-result-info');
            
            // Drawing state
            let isDrawing = false;
            let lastX = 0;
            let lastY = 0;
            let hasUploadedImage = false;
            
            // Set up drawing canvas
            drawingCtx.strokeStyle = 'red';
            drawingCtx.lineWidth = 4;
            drawingCtx.lineCap = 'round';
            drawingCtx.lineJoin = 'round';
            
            // Drawing event listeners
            drawingCanvas.addEventListener('mousedown', startDrawing);
            drawingCanvas.addEventListener('mousemove', draw);
            drawingCanvas.addEventListener('mouseup', stopDrawing);
            drawingCanvas.addEventListener('mouseout', stopDrawing);
            
            // Touch events for mobile
            drawingCanvas.addEventListener('touchstart', handleTouch);
            drawingCanvas.addEventListener('touchmove', handleTouch);
            drawingCanvas.addEventListener('touchend', stopDrawing);
            
            function startDrawing(e) {
                isDrawing = true;
                const rect = drawingCanvas.getBoundingClientRect();
                lastX = e.clientX - rect.left;
                lastY = e.clientY - rect.top;
            }
            
            function draw(e) {
                if (!isDrawing) return;
                
                const rect = drawingCanvas.getBoundingClientRect();
                const currentX = e.clientX - rect.left;
                const currentY = e.clientY - rect.top;
                
                drawingCtx.beginPath();
                drawingCtx.moveTo(lastX, lastY);
                drawingCtx.lineTo(currentX, currentY);
                drawingCtx.stroke();
                
                lastX = currentX;
                lastY = currentY;
            }
            
            function stopDrawing() {
                isDrawing = false;
            }
            
            function handleTouch(e) {
                e.preventDefault();
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent(e.type === 'touchstart' ? 'mousedown' : 
                                                 e.type === 'touchmove' ? 'mousemove' : 'mouseup', {
                    clientX: touch.clientX,
                    clientY: touch.clientY
                });
                drawingCanvas.dispatchEvent(mouseEvent);
            }
            
            // Clear button - clears both drawing and predictions
            clearButton.addEventListener('click', function() {
                drawingCtx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
                drawingResultInfo.classList.add('hidden');
                resultsContainer.classList.add('hidden');
                hasUploadedImage = false;
            });
            
            // Upload button
            uploadButton.addEventListener('click', function() {
                fileInput.click();
            });
            
            // Handle file input change
            fileInput.addEventListener('change', function() {
                if (fileInput.files.length > 0) {
                    handleFileUpload(fileInput.files[0]);
                }
            });
            
            function handleFileUpload(file) {
                if (!file.type.match('image.*')) {
                    alert('Please upload an image file');
                    return;
                }
                
                const img = new Image();
                img.onload = function() {
                    // Clear canvas first
                    drawingCtx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
                    
                    // Calculate dimensions to fit image in canvas while maintaining aspect ratio
                    const canvasRatio = drawingCanvas.width / drawingCanvas.height;
                    const imageRatio = img.width / img.height;
                    
                    let drawWidth, drawHeight, offsetX, offsetY;
                    
                    if (imageRatio > canvasRatio) {
                        // Image is wider, fit to width
                        drawWidth = drawingCanvas.width;
                        drawHeight = drawWidth / imageRatio;
                        offsetX = 0;
                        offsetY = (drawingCanvas.height - drawHeight) / 2;
                    } else {
                        // Image is taller, fit to height
                        drawHeight = drawingCanvas.height;
                        drawWidth = drawHeight * imageRatio;
                        offsetX = (drawingCanvas.width - drawWidth) / 2;
                        offsetY = 0;
                    }
                    
                    // Draw the image on the canvas
                    drawingCtx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);
                    hasUploadedImage = true;
                };
                
                img.src = URL.createObjectURL(file);
            }
            
            // Send button - works for both drawings and uploads
            sendButton.addEventListener('click', function() {
                // Check if there's any content on the canvas
                const imageData = drawingCtx.getImageData(0, 0, drawingCanvas.width, drawingCanvas.height);
                const hasContent = imageData.data.some((pixel, index) => {
                    return index % 4 === 3 && pixel !== 0; // Check alpha channel
                });
                
                if (!hasContent) {
                    alert('Please draw something or upload an image first!');
                    return;
                }
                
                // Create a temporary canvas with white background
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCanvas.width = drawingCanvas.width;
                tempCanvas.height = drawingCanvas.height;
                
                // Fill with white background
                tempCtx.fillStyle = 'white';
                tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                
                // Draw the original content on top
                tempCtx.drawImage(drawingCanvas, 0, 0);
                
                // Convert temp canvas to blob and send
                tempCanvas.toBlob(function(blob) {
                    sendToAPI(blob, true);
                }, 'image/png');
            });
            

            
            // Send to API (works for both drawing and upload)
            function sendToAPI(imageData, isDrawing) {
                const formData = new FormData();
                
                if (isDrawing) {
                    formData.append('image', imageData, 'drawing.png');
                } else {
                    formData.append('image', imageData);
                }
                
                if (isDrawing) {
                    // For drawings, show loading overlay on the drawing canvas
                    drawingCanvas.style.opacity = '0.5';
                    drawingResultInfo.classList.add('hidden');
                } else {
                    // For uploads, show results container and loading
                    resultsContainer.classList.remove('hidden');
                    loadingOverlay.classList.add('visible');
                    resultInfo.classList.add('hidden');
                }
                
                fetch('https://api.ramihaider.me/predict', {
                    method: 'POST',
                    body: formData
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    if (isDrawing) {
                        drawingCanvas.style.opacity = '1';
                    } else {
                        loadingOverlay.classList.remove('visible');
                    }
                    displayResults(data, imageData, isDrawing);
                })
                .catch(error => {
                    console.error('Error:', error);
                    if (isDrawing) {
                        drawingCanvas.style.opacity = '1';
                        drawingResultInfo.classList.remove('hidden');
                        drawingResultInfo.textContent = 'Error processing image. Please try again.';
                    } else {
                        loadingOverlay.classList.remove('visible');
                        resultInfo.classList.remove('hidden');
                        resultInfo.textContent = 'Error processing image. Please try again.';
                    }
                });
            }
            
            // Display results
            function displayResults(data, imageData, isDrawing) {
                if (isDrawing) {
                    // For drawings, draw directly on the drawing canvas
                    drawDetectionsOnCanvas(drawingCtx);
                } else {
                    // For uploads, load the image and draw on result canvas
                    const img = new Image();
                    img.onload = function() {
                        resultCanvas.width = img.width;
                        resultCanvas.height = img.height;
                        resultCtx.drawImage(img, 0, 0);
                        drawDetectionsOnCanvas(resultCtx);
                    };
                    img.src = URL.createObjectURL(imageData);
                    return;
                }
                
                function drawDetectionsOnCanvas(ctx) {
                    const infoElement = isDrawing ? drawingResultInfo : resultInfo;
                    infoElement.classList.remove('hidden');
                    
                    if (data.detections && data.detections.length > 0) {
                        // Draw bounding boxes without confidence scores
                        data.detections.forEach(detection => {
                            const { x1, y1, x2, y2 } = detection;
                            
                            ctx.strokeStyle = 'red';
                            ctx.lineWidth = 3;
                            ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
                        });
                        
                        infoElement.textContent = `${data.detections.length} ${data.detections.length === 1 ? 'anomaly' : 'anomalies'} detected`;
                    } else {
                        infoElement.textContent = 'No anomalies detected';
                    }
                }
            }
        });
    </script>
</body>
</html>
